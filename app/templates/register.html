{% extends "base.html" %}
{% block content %}

<section class="register-section d-flex align-items-center justify-content-center py-5">
  <div class="register-card shadow-lg rounded-4 p-4 p-md-5 bg-white col-12 col-md-8 col-lg-5">

    <div class="text-center mb-4">
      <div class="register-icon mb-2">💎</div>
      <h2 class="fw-bold text-primary mb-1">Crear cuenta</h2>
      <p class="text-muted small mb-0">Regístrate para explorar nuestro catálogo y realizar pedidos.</p>
    </div>

    <form method="post" action="{{ url_for('auth.register_post') }}" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Nombres</label>
          <input type="text" name="first_name" class="form-control form-control-lg" placeholder="Ej. Juan" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Apellidos</label>
          <input type="text" name="last_name" class="form-control form-control-lg" placeholder="Ej. Pérez" required>
        </div>
      </div>

      <div class="mt-3">
        <label class="form-label fw-semibold">Correo electrónico</label>
        <input type="email" name="email" class="form-control form-control-lg" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="row g-3 mt-1">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Contraseña</label>
          <input type="password" name="password" class="form-control form-control-lg" placeholder="********" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Confirmar contraseña</label>
          <input type="password" name="confirm" class="form-control form-control-lg" placeholder="********" required>
        </div>
      </div>

      <div class="form-text mt-2 small text-muted">
        La contraseña debe tener al menos 8 caracteres.
      </div>

      <div class="mt-4 d-grid">
        <button class="btn btn-lg btn-success">Crear cuenta</button>
      </div>

      <div class="text-center mt-3 small">
        ¿Ya tienes cuenta?
        <a href="{{ url_for('auth.login_form') }}" class="fw-semibold text-decoration-none text-primary">
          Inicia sesión aquí
        </a>
      </div>
    </form>
  </div>
</section>

{% endblock %}
